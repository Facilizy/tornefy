<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>Tornefy Overlay - MVP</title>
    <style>
      :root {
        --bg: transparent;
        --panel: hsl(214 16% 8% / 0.78);
        --panel-2: hsl(214 16% 8% / 0.58);
        --stroke: hsl(220 10% 18% / 0.85);
        --text: hsl(0 0% 98%);
        --muted: hsl(240 5% 70%);
        --primary: hsl(264 100% 64%);
        --primary-2: hsl(280 85% 75%);
      }

      * { box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 300px;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }

      .root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 22px;
      }

      .frame {
        width: 100%;
        height: 100%;
        border: 1px solid var(--stroke);
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border-radius: 18px;
        overflow: hidden;
        position: relative;
        display: grid;
        place-items: center;
      }

      .glow {
        position: absolute;
        inset: -45% -20% auto -20%;
        height: 260px;
        background: radial-gradient(circle at 50% 50%, hsl(264 100% 64% / 0.28), transparent 60%);
        pointer-events: none;
      }

      .card {
        width: min(980px, 92%);
        border: 1px solid hsl(264 100% 64% / 0.25);
        background: linear-gradient(90deg, hsl(264 100% 64% / 0.14), hsl(214 16% 8% / 0.55) 55%);
        border-radius: 18px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .logo {
        width: 86px;
        height: 86px;
        border-radius: 22px;
        background: hsl(214 16% 8%);
        border: 1px solid var(--stroke);
        overflow: hidden;
        flex: 0 0 auto;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .content { min-width: 0; flex: 1; }

      .label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-weight: 900;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--primary);
        box-shadow: 0 0 18px hsl(264 100% 64% / 0.35);
      }

      .name {
        font-size: 28px;
        font-weight: 950;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sub {
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: hsl(214 16% 8% / 0.45);
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      .num { color: var(--text); font-weight: 900; }

      .status {
        position: absolute;
        right: 14px;
        bottom: 10px;
        font-size: 11px;
        color: hsl(240 5% 65%);
      }

      ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="frame">
        <div class="glow"></div>

        <div class="card" role="region" aria-label="MVP">
          <div class="logo" id="logo"></div>
          <div class="content">
            <div class="label"><span class="dot"></span> MVP</div>
            <div class="name" id="name">—</div>
            <div class="sub">
              <span id="tag">—</span>
              <span class="pill">Rank <span class="num" id="rank">—</span></span>
              <span class="pill">Kills <span class="num" id="kills">—</span></span>
              <span class="pill">Pts <span class="num" id="pts">—</span></span>
            </div>
          </div>
        </div>

        <div class="status" id="status"></div>
      </div>
    </div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      // CONFIG
      const SUPABASE_URL = "REPLACE_SUPABASE_URL";
      const SUPABASE_ANON_KEY = "REPLACE_SUPABASE_ANON_KEY";
      const VIEW_NAME = "vw_tornefy_ranking";
      const POLL_MS = 10_000;

      const qs = new URLSearchParams(location.search);
      const treinoId = qs.get("treino_id");
      const quedaId = qs.get("queda_id");
      const rodadaId = qs.get("rodada_id");

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const elLogo = document.getElementById("logo");
      const elName = document.getElementById("name");
      const elTag = document.getElementById("tag");
      const elRank = document.getElementById("rank");
      const elKills = document.getElementById("kills");
      const elPts = document.getElementById("pts");
      const elStatus = document.getElementById("status");

      let lastHash = "";

      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[c]));

      function render(row) {
        elLogo.innerHTML = row?.team_logo
          ? `<img src="${esc(row.team_logo)}" alt="Logo ${esc(row.team_name)}" />`
          : "";

        elName.textContent = row?.team_name || "—";
        elTag.textContent = row?.team_tag ? `[${row.team_tag}]` : "—";
        elRank.textContent = row?.rank ?? "—";
        elKills.textContent = row?.kills ?? "—";
        elPts.textContent = row?.points ?? "—";
      }

      async function fetchAndUpdate() {
        try {
          if (!treinoId) {
            render(null);
            elStatus.textContent = "Informe ?treino_id=";
            return;
          }

          let query = supabase
            .from(VIEW_NAME)
            .select("team_name,team_tag,team_logo,rank,points,kills,is_mvp,treino_id,queda_id,rodada_id")
            .eq("treino_id", treinoId)
            .eq("is_mvp", true);

          if (quedaId) query = query.eq("queda_id", quedaId);
          if (rodadaId) query = query.eq("rodada_id", rodadaId);

          const { data, error } = await query.limit(1);

          if (error) throw error;

          const row = Array.isArray(data) && data.length ? data[0] : null;
          const h = JSON.stringify(row ? [row.team_tag, row.rank, row.points, row.kills, row.team_logo] : [null]);

          if (h !== lastHash) {
            lastHash = h;
            render(row);
          }

          const now = new Date();
          elStatus.textContent = `Atualizado ${now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        } catch (e) {
          elStatus.textContent = "Erro ao carregar";
          console.error(e);
        }
      }

      fetchAndUpdate();
      setInterval(fetchAndUpdate, POLL_MS);
    </script>
  </body>
</html>
